name: hermes-lcm
version: 0.21.0-rc2
description: "Lossless Context Management — standalone Hermes plugin with a DAG-based context engine that never loses a message"
author: "Voltropy / Hermes Community"
provides_tools:
  - lcm_grep
  - lcm_recall
  - lcm_query_state
  - lcm_compute
  - lcm_compile_evidence
  - lcm_evidence_pack
  - lcm_retrieve
  - lcm_recent
  - lcm_load_session
  - lcm_describe
  - lcm_expand
  - lcm_expand_query
  - lcm_pin
  - lcm_unpin
  - lcm_status
  - lcm_inspect
  - lcm_doctor
